[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-finder"
version = "0.1.0"
description = "Search a document collection and get ranked passages with exact source references, with measured retrieval quality."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
# Lower bounds are releases at least two weeks old when they were chosen (2026-11-07).
dependencies = [
    "docutils>=0.23,<1",
    "fastapi>=0.162.0,<0.163",   # the search page; 0.x minors can break, so one minor at a time
    "numpy>=2.5,<3",
    "pypdf>=6.21,<7",
    "scikit-learn>=1.9.1,<2",   # LSA for semantic search (TF-IDF and truncated SVD)
    "uvicorn>=0.54,<0.55",      # serves the search page
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "hypothesis>=6.170,<7",
    "fpdf2>=2.8.9,<3",   # only to generate test PDFs
    "httpx2>=2.16,<3",
    "ruff>=0.17.3,<0.18",   # lint; CI runs it   # FastAPI's TestClient (Starlette prefers it to httpx)
]

[project.scripts]
evfind = "evfind.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evfind = ["data/*.jsonl.gz"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# pyflakes, syntax errors, bugbear, pyupgrade, simplify, import order
select = ["F", "E9", "B", "UP", "SIM", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]
